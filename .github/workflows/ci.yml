name: IoT Backend CI Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint and Test Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
